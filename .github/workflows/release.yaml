name: Publish Documentation

on:
  push:
    branches: ["main"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Publish documentation
        run: |
          # Preserve the published v2 paths while keeping the source tree flat.
          docs_publish_dir="$(mktemp -d)"
          mkdir "$docs_publish_dir/v2"
          cp -R docs/. "$docs_publish_dir/v2/"
          rclone sync "$docs_publish_dir" s3:docs/ --stats-one-line -v
      - run: "rclone sync devlog s3:devlog/ --stats-one-line -v"
